services:
  mongodb:
    image: mongo:6.0
    container_name: shoplane_mongodb
    restart: always
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: shoplane
    volumes:
      - mongo_data:/data/db
    networks:
      - shoplane_network

  redis:
    image: redis:7-alpine
    container_name: shoplane_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - shoplane_network

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: shoplane_meilisearch
    restart: always
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: shoplane_meili_secret_2026
      MEILI_ENV: development
    volumes:
      - meili_data:/meili_data
    networks:
      - shoplane_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shoplane_backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGODB_URI: mongodb://mongodb:27017/shoplane
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: shoplane_meili_secret_2026
      JWT_SECRET: shoplane_super_secret_jwt_key_2026
      JWT_ACCESS_SECRET: shoplane_super_secret_access_key_2026
      JWT_REFRESH_SECRET: shoplane_super_secret_refresh_key_2026
      JWT_ACCESS_EXPIRE: 15m
      JWT_REFRESH_EXPIRE: 7d
    depends_on:
      - mongodb
      - redis
      - meilisearch
    networks:
      - shoplane_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shoplane_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5001/api
    depends_on:
      - backend
    networks:
      - shoplane_network

volumes:
  mongo_data:
  redis_data:
  meili_data:

networks:
  shoplane_network:
    driver: bridge
